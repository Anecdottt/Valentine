<!DOCTYPE html>
<html>
<head>
    <style>
        /* Основные стили */
        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at center, #ffffff, #ff99cc);
            font-family: 'Arial Rounded MT Bold', sans-serif;
            cursor: pointer;
        }

        #start-screen {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.9);
            transition: 1s;
            z-index: 2;
            backdrop-filter: blur(5px);
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }

        h1 {
            color: #ff3f6d;
            font-size: 4em;
            margin: 0;
            text-shadow: 2px 2px 8px rgba(255, 255, 255, 0.7);
            animation: pulse 1.5s infinite;
        }

        .subtitle {
            color: white;
            font-size: 1.5em;
            margin-top: 20px;
            opacity: 0.9;
        }

        #hearts-container {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* Стили для фоновых сердечек */
        .bg-heart {
            position: absolute;
            color: #ff3f6d;
            animation: bg-heart-float linear infinite;
            opacity: 0.5;
            z-index: 0;
            filter: blur(1px);
        }

        @keyframes bg-heart-float {
            0% {
                transform: translateY(100vh);
            }
            100% {
                transform: translateY(-100vh);
            }
        }

        /* Стили для основных сердечек */
        .heart {
            position: absolute;
            color: #ff3f6d;
            font-size: 40px;
            animation: heart-float 1.5s ease-out forwards;
            opacity: 0.9;
            z-index: 1;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        @keyframes heart-float {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(var(--dx), var(--dy)) scale(0);
                opacity: 0;
            }
        }

        #message {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff3f6d;
            font-size: 2.5em;
            font-weight: bold;
            text-align: center;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.9);
            z-index: 1;
            width: 90%;
            max-width: 800px;
            line-height: 1.4;
        }

        #big-heart {
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 150px;
            color: #ff3f6d;
            animation: heartbeat 1s infinite;
            filter: drop-shadow(0 0 20px rgba(255, 63, 109, 0.8));
        }

        @keyframes heartbeat {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.05); }
        }
    </style>
</head>
<body>
    <div id="start-screen">
        <h1>др 💌</h1>
        <div class="subtitle">Нажми в любом месте</div>
    </div>

    <div id="hearts-container"></div>
    <div id="message"></div>
    <div id="big-heart">❤️</div>

    <script>
        const messages = [
            "Хай пикми ❤️",
            "это короче",
            "как оно называется то",
            "ну бля, ну как",
            "ёбана",
            "вспомнила",
            "то самое",
            "оно это того",
            "бро",
            "хэпи нью бро",
            "жить по жить короче",
            "и не не пожить",
            "ну короч",
            "го встр"
        ];

        let messageIndex = 0;
        let isFinal = false;
        let messageInProgress = false;

        // Функция для создания фоновых сердечек
        function createBackgroundHeart() {
            const heart = document.createElement('div');
            heart.className = 'bg-heart';
            heart.textContent = '❤';

            const depth = Math.random();
            const size = 20 + depth * 50;
            const speed = 5 + depth * 10; // Уменьшено время анимации
            const blur = 1 + (1 - depth) * 3;
            const opacity = 0.3 + depth * 0.4;

            heart.style.fontSize = `${size}px`;
            heart.style.left = `${Math.random() * 100}%`;
            heart.style.animationDuration = `${speed}s`;
            heart.style.filter = `blur(${blur}px)`;
            heart.style.opacity = opacity;

            document.getElementById('hearts-container').appendChild(heart);
            setTimeout(() => heart.remove(), speed * 1000);
        }

        function startBackgroundHearts() {
            for(let i = 0; i < 30; i++) { // Увеличено начальное количество
                createBackgroundHeart();
            }
            setInterval(createBackgroundHeart, 300); // Уменьшен интервал
        }

        function createHeart(x, y) {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.textContent = '❤';

            if(isFinal) {
                heart.style.fontSize = `${Math.random() * 50 + 50}px`;
                y = Math.random() * window.innerHeight * 0.4;
            } else {
                heart.style.fontSize = `${Math.random() * 40 + 40}px`;
            }

            const angle = Math.random() * Math.PI * 2;
            const distance = 100 + Math.random() * 200;
            const dx = Math.cos(angle) * distance;
            const dy = Math.sin(angle) * distance;

            heart.style.left = `${x}px`;
            heart.style.top = `${y}px`;
            heart.style.setProperty('--dx', `${dx}px`);
            heart.style.setProperty('--dy', `${dy}px`);

            document.getElementById('hearts-container').appendChild(heart);
            setTimeout(() => heart.remove(), 1500); // Уменьшено время жизни
        }

        function showMessage() {
            if (messageIndex >= messages.length) {
                if (!isFinal) {
                    isFinal = true;
                    setInterval(() => {
                        const x = Math.random() * window.innerWidth;
                        const y = Math.random() * window.innerHeight * 0.4;
                        createHeart(x, y);
                    }, 200); // Уменьшен интервал
                }
                return;
            }

            if (messageInProgress) return;
            messageInProgress = true;

            const messageElement = document.getElementById('message');
            messageElement.textContent = '';
            let currentMessage = messages[messageIndex];
            let charIndex = 0;

            function typeWriter() {
                if (charIndex < currentMessage.length) {
                    messageElement.textContent += currentMessage.charAt(charIndex);
                    charIndex++;
                    setTimeout(typeWriter, 80); // Увеличена скорость печати
                } else {
                    messageInProgress = false;
                }
            }

            typeWriter();
            messageIndex++;
        }

        function handleClick(event) {
            if (!isFinal) {
                showMessage();
            }
            
            const x = event.clientX;
            const y = event.clientY;
            
            for (let i = 0; i < 7; i++) { // Увеличено количество сердечек за клик
                setTimeout(() => createHeart(x, y), i * 30); // Уменьшена задержка
            }
        }

        document.body.addEventListener('click', function init(event) {
            document.getElementById('start-screen').classList.add('hidden');
            document.body.removeEventListener('click', init);
            handleClick(event);
            document.body.addEventListener('click', handleClick);
            startBackgroundHearts();
        });
    </script>
</body>
</html>
